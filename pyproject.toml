[project]
name = "dali-interface"
description = "A common API for different hardware realizations of a DALI interface."
authors = [{ name = "Sven Hädrich", email = "sven.haedrich@sevenlab.de" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dynamic = ["version"]

dependencies = [
    "pyusb == 1.3.1",              # No information on versioning schema, using fixed version.
    "pyserial == 3.5",             # No information on versioning schema, using fixed version.
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Embedded Systems",
]

[project.optional-dependencies]
dev = [
    "types-pyserial",
    "pytest >= 9.0.0",
    "pytest-mypy-plugins >= 4.0.2",
]

[project.urls]
repository = "https://github.com/sevenlab-de/dali-interface"
issues = "https://github.com/sevenlab-de/dali-interface/issues"
changelog = "http://github.com/sevenlab-de/dali-interface/changelog.md"

[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "versioningit"

[tool.hatch.build.targets.wheel]
packages = ["dali_interface"]

[tool.hatch.build.targets.sdist]
exclude = [".github/"]

[tool.versioningit]

[tool.ruff]
line-length = 120

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.pyright]
typeCheckingMode = "strict"
